<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Glens Falls geodata debug view</title>
  <link rel="icon" href="data:," />
  <!-- Same pinned three.js commit as index.html -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/gh/mrdoob/three.js@b3396270682287470d161658ac01084d25e8dba6/build/three.webgpu.js",
        "three/webgpu": "https://cdn.jsdelivr.net/gh/mrdoob/three.js@b3396270682287470d161658ac01084d25e8dba6/build/three.webgpu.js",
        "three/tsl": "https://cdn.jsdelivr.net/gh/mrdoob/three.js@b3396270682287470d161658ac01084d25e8dba6/build/three.tsl.js",
        "three/addons/": "https://cdn.jsdelivr.net/gh/mrdoob/three.js@b3396270682287470d161658ac01084d25e8dba6/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./js/gf-debug.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1d2126; color: #e8eaed; font: 13px/1.4 system-ui, sans-serif; }
    #gf-canvas { position: fixed; inset: 0; }
    .gf-panel { position: fixed; background: rgba(20, 23, 27, 0.82); border-radius: 6px; padding: 8px 10px; pointer-events: none; }
    #gf-info { top: 12px; left: 12px; max-width: 360px; }
    #gf-info h1 { font-size: 14px; margin: 0 0 4px; }
    #gf-info p { margin: 2px 0; }
    #gf-legend span { display: inline-block; width: 10px; height: 10px; margin: 0 4px 0 8px; vertical-align: -1px; border-radius: 2px; }
    #gf-attribution { right: 12px; bottom: 12px; pointer-events: auto; }
    #gf-attribution a { color: #9cc4ff; }
    #gf-error { top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: 480px; display: none; }
  </style>
</head>
<body>
  <div id="gf-canvas"></div>
  <div id="gf-info" class="gf-panel">
    <h1>Glens Falls · geodata debug view</h1>
    <p id="gf-stats">Loading…</p>
    <p id="gf-legend"></p>
    <p>Drag to orbit · right-drag to pan · scroll to zoom · WASD / arrows to fly (Shift = fast, Q/E = down/up) · R to reset</p>
  </div>
  <div id="gf-attribution" class="gf-panel">Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a> (ODbL)</div>
  <div id="gf-error" class="gf-panel"></div>
</body>
</html>
